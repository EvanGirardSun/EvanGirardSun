<text x="230" y="48" class="muted" font-size="21">~ $ whoami</text>
<path d="M40 68H1360" stroke="#344250"/>
<text x="660" y="160" class="value" font-size="42" font-weight="700">Evan Girard-Sun</text>
<text x="660" y="223" class="value" font-size="25">I like working on robots, whether that</text>
<text x="660" y="257" class="value" font-size="25">means writing control software or</text>
<text x="660" y="291" class="value" font-size="25">designing the hardware around it.</text>
