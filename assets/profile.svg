<title id="title">Evan Girard-Sun — robotics and embedded systems</title>
<desc id="desc">Tools include Python, OpenCV, KiCad and Fusion. Phi Lab autonomy uses 640 by 480 video and a configured 250 Hz CRSF send rate. The preliminary ECU archive contains 53 PCB footprints and 115 listed connections checked against the PCB.</desc>
