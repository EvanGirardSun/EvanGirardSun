<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Evan Girard-Sun — robotics, code and hardware</title>
<desc id="desc">An ASCII portrait of Evan beside a personal introduction. Current work: camera-based drone control. Previous NASA ER4 robotics internship. Python, OpenCV, PCB design, KiCad, Fusion and Onshape. Interested in space exploration. A text diagram shows the camera-to-control feedback loop.</desc>
