<text x="40" y="48" class="value" font-size="21" font-weight="700">evan@workbench</text>
<text x="230" y="48" class="muted" font-size="21">~ $ whoami</text>
<path d="M40 68H680" stroke="#344250"/>
<text x="40" y="121" class="value" font-size="42" font-weight="700">Evan Girard-Sun</text>
<text x="40" y="173" class="value" font-size="25">I like working on robots, whether that</text>
<text x="40" y="207" class="value" font-size="25">means writing control software or</text>
<text x="40" y="241" class="value" font-size="25">designing the hardware around it.</text>
